<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق الراعي لإدارة الافتقاد والخدمة">
  <meta name="google-signin-client_id" content="882251802958-d052icjb1rkgp6556n2cvme5k5rneava.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="efteqad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>الراعي - إدارة الافتقاد والخدمة</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A192F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #132338 0%, #0A192F 70%, #060B12 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .loading-title {
      font-size: 32px;
      font-weight: 800;
      color: #D4AF37;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <span style="font-family: 'Cairo', sans-serif; position: absolute; left: -9999px; top: -9999px; visibility: hidden;" aria-hidden="true">
    الراعي مرحباً بكم في تطبيق الافتقاد تسجيل الدخول خدمة الخادم المشرف مخدومين مهام تقارير
  </span>
  <div id="loading-indicator">
    <div class="loading-title">الراعي</div>
    <div class="loading-subtitle">جاري التحميل...</div>
    <div class="loading-spinner"></div>
  </div>
  <script>
    function removeLoader() {
      const loader = document.getElementById("loading-indicator");
      if (loader && !loader.dataset.hiding) {
        loader.dataset.hiding = "true";
        loader.style.opacity = "0";
        loader.style.pointerEvents = "none";
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }

    // 1. Observe when Flutter engine injects its view or glass-pane
    const observer = new MutationObserver((mutations) => {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.tagName && (
              node.tagName.toLowerCase().includes("flt") ||
              node.tagName.toLowerCase().includes("flutter") ||
              node.tagName.toLowerCase() === "canvas"
          )) {
            removeLoader();
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 2. Safety timeout fallback: remove after 4 seconds max
    setTimeout(removeLoader, 4000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
